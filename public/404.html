<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayfa Bulunamadı · MAIS Studio</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Manrope:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0d0d0e; --panel:#1c1b1c; --yellow:#f2c230; --cream:#f3eee1; --text-dim:#9c968b; --line:rgba(243,238,225,0.10); }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--cream); font-family:'Montserrat',sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; gap:18px;
  }
  .plate{
    display:inline-flex; border-radius:9px; overflow:hidden; border:1.5px solid var(--cream); background:#111;
  }
  .plate .p-tag{ background:var(--yellow); color:#141116; font-family:'Montserrat'; font-size:13px; padding:8px 12px; }
  .plate .p-txt{ padding:8px 14px; font-family:'JetBrains Mono'; font-weight:700; font-size:13px; }
  h1{ font-family:'Montserrat'; text-transform:uppercase; font-size:clamp(32px,6vw,52px); margin-top:6px; }
  p{ color:var(--text-dim); max-width:40ch; font-size:14.5px; }
  a.btn{
    margin-top:10px; padding:14px 26px; border-radius:10px; background:var(--yellow); color:#141116;
    font-weight:800; font-size:14px; text-decoration:none;
  }
</style>
</head>
<body>
  <div class="plate"><span class="p-tag">404</span><span class="p-txt">SAYFA YOK</span></div>
  <h1>Bu Yol Buraya Çıkmıyor</h1>
  <p>Aradığın sayfa kaldırılmış, taşınmış ya da hiç var olmamış olabilir. Başvuru sayfasına dönelim.</p>
  <a class="btn" href="index.html">Ana Sayfaya Dön</a>
</body>
</html>
